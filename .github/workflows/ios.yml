# Builds the iPhone app on a free GitHub macOS runner.
# Input: ClashCircuit-ios-xcode.zip attached to a release (made on Linux by ./build_ios.sh).
# Output: an unsigned ClashCircuit.ipa attached to the same release. Sideload it with your own
# Apple ID (AltStore, Sideloadly or Impactor), which signs it for your device.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that has ClashCircuit-ios-xcode.zip (e.g. v0.3.1)"
        required: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download the exported Xcode project
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p ClashCircuit-ios-xcode.zip
          mkdir xcode && cd xcode && unzip -q ../ClashCircuit-ios-xcode.zip && ls

      - name: Build (unsigned)
        working-directory: xcode
        run: |
          xcodebuild -project ClashCircuit.xcodeproj -scheme ClashCircuit -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/cc.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" | tail -n 40

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/cc.xcarchive/Products/Applications/ClashCircuit.app" Payload/
          zip -qry ClashCircuit.ipa Payload
          ls -la ClashCircuit.ipa

      - name: Attach to the release
        run: gh release upload "$TAG" ClashCircuit.ipa -R "$GITHUB_REPOSITORY" --clobber
